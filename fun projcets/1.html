<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cat Portfolio</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      /* nav {
        
        margin: auto;
        margin-top: 6px;
        padding: 10px;
        display: flex;
        height: 8vh;
        width: 70%;
        background-color: antiquewhite;
        background: linear-gradient(to right, #007bff, #00d4ff);
        justify-content: space-around;
        align-items: center;
        border-radius: 10px;

      nav {
        position: relative;
        margin: auto;
        margin-top: 6px;
        padding: 10px;
        display: flex;
        height: 8vh;
        width: 70%;
        background: linear-gradient(to right, #007bff, #00d4ff);
        justify-content: space-around;
        align-items: center;
        border-radius: 10px;
        transform: translateY(-100px);
        opacity: 0;
        animation: slideDown 1.8s ease-in-out forwards;
      }

      @keyframes slideDown {
        0% {
          transform: translateY(-100px);
          opacity: 0;
        }
        100% {
          transform: translateY(0);
          opacity: 1;
        }
      }

      nav a {
        text-decoration: none;
        color: black;
      }
      nav ul {
        display: flex;
        list-style-type: none;
      }
      nav ul li {
        padding: 10px;
        transition: transform 0.3s ease-in-out; /* Smooth transition */
      }

      nav ul:hover li {
        transform: scale(0.9); /* Shrinks all items a little */
      }

      nav ul li:hover {
        transform: scale(1.2); /* Enlarges the hovered item */
      }

      section {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 56px;
        padding: 20px;
        height: 80vh;
      }
      section div {
        max-width: 50%;
      }

      img {
        /* max-width: 100%; */
        width: 380px;
        height: auto;
        border-radius: 10px;
      }
      html {
        scroll-behavior: smooth;
      }
    </style>
  </head>
  <body>
    <nav>
      <p>Mimi's Home</p>
      <ul>
        <li><a href="#Home">Home</a></li>
        <li><a href="#Services">Services</a></li>
        <li><a href="#About">About</a></li>
        <li><a href="#Contact us">Contact us</a></li>
      </ul>
    </nav>
    <section>
      <div>
        <img src="download.jpeg" alt="cat" />
      </div>
      <div>
        <h1>Hey I am Mimi</h1>
        <p>I like to play with mice and human like You!😁</p>
      </div>
    </section>
  </body>
</html>
